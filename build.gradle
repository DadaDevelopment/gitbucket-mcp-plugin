plugins {
    id('scala')
    id('com.github.johnrengelman.shadow') version '8.1.1'
}

group = 'com.newsrx'
version = '0.1.0'

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
}

dependencies {
    implementation 'org.scala-lang:scala-library:2.13.18'

    compileOnly 'io.github.gitbucket:gitbucket_2.13:4.46.0'
    compileOnly 'io.github.gitbucket:solidbase:1.1.0'
    compileOnly 'org.scalatra:scalatra-javax_2.13:3.1.2'
    compileOnly 'io.github.json4s:json4s-jackson_2.13:4.1.0'
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    compileOnly 'com.github.takezoe:blocking-slick_2.13:0.0.14'
    // Already on GitBucket's runtime classpath (it uses Nimbus for its own
    // OpenID Connect sign-in), so this is compileOnly and is not bundled.
    // Pinned to the version shipped by the oldest supported GitBucket, 4.46.0,
    // so only API present across the tested range is used.
    compileOnly 'com.nimbusds:oauth2-oidc-sdk:11.33'

    // Apache HttpClient parses HTTP messages, including the framing a
    // hand-written reader got wrong: a body short of its Content-Length and
    // an unparseable chunk size both have to be errors, not a short string.
    // GitBucket ships both jars (4.5.14 / 4.4.16 in 4.46.0 through 4.48.0),
    // so this is compileOnly and nothing is bundled.
    compileOnly 'org.apache.httpcomponents:httpclient:4.5.14'
    compileOnly 'org.apache.httpcomponents:httpcore:4.4.16'

    testImplementation 'org.scalatest:scalatest_2.13:3.2.18'
    testImplementation 'org.scalatestplus:junit-4-13_2.13:3.2.18.0'
    testRuntimeOnly 'junit:junit:4.13.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testCompileOnly 'io.github.gitbucket:gitbucket_2.13:4.46.0'
    testCompileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    testCompileOnly 'com.nimbusds:oauth2-oidc-sdk:11.33'
    testRuntimeOnly 'com.nimbusds:oauth2-oidc-sdk:11.33'
    testCompileOnly 'org.apache.httpcomponents:httpclient:4.5.14'
    testRuntimeOnly 'org.apache.httpcomponents:httpclient:4.5.14'
    testRuntimeOnly 'org.apache.httpcomponents:httpcore:4.4.16'
    testRuntimeOnly 'io.github.gitbucket:gitbucket_2.13:4.46.0'
    testRuntimeOnly 'javax.servlet:javax.servlet-api:4.0.1'
    testRuntimeOnly 'com.github.takezoe:blocking-slick_2.13:0.0.14'
}

sourceSets {
    main {
        scala {
            srcDirs = ['src/main/scala', 'src/main/java']
        }
        java {
            srcDirs = []
        }
    }
}

test {
    useJUnit()
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.build.dependsOn shadowJar
